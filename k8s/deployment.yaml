apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubernetes-production-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: kubernetes-production-app

  template:
    metadata:
      labels:
        app: kubernetes-production-app

    spec:
      containers:
        - name: kubernetes-production-app

          image: king9090/kubernetes-production-app:v1

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 10
            periodSeconds: 20
