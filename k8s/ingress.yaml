apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: kubernetes-production-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: kubernetes.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: kubernetes-production-service

                port:
                  number: 80
